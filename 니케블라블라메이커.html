<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>니케 일부 보고 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0: #05070C;
    --bg-1: #0A0F18;
    --panel: #0E1521;
    --panel-2: #121A28;
    --line: #1E2C3F;
    --line-soft: #16202E;
    --ink: #E7EDF6;
    --ink-dim: #7A8AA0;
    --ink-faint: #4B5A70;
    --cyan: #34E4E0;
    --cyan-dim: rgba(52, 228, 224, 0.14);
    --amber: #FFB238;
    --amber-dim: rgba(255, 178, 56, 0.14);
    --mint: #34E4A0;
    --mint-dim: rgba(52, 228, 160, 0.14);
    --red: #FF5470;
    --red-dim: rgba(255, 84, 112, 0.14);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(52,228,224,0.07), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(255,178,56,0.05), transparent 40%),
      var(--bg-0);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 20px;
  }
  .hud{ font-family:'Rajdhani', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .stage{ width:100%; max-width: 440px; }
  .card{
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-1) 100%);
    border-radius: var(--radius-lg);
    border: 1px solid var(--line);
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.25;
    pointer-events:none;
  }

  /* ---------- Header ---------- */
  .topbar{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{
    font-size: 10px; font-weight:600; color: var(--cyan);
    letter-spacing: 0.28em;
  }
  .brand .title{ font-size: 21px; font-weight:700; color: var(--ink); letter-spacing: 0.06em; }
  .stat-pills{ display:flex; gap:8px; }
  .pill{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight:700;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--cyan);
    padding: 7px 11px;
    border-radius: 8px;
    letter-spacing: 0.03em;
  }
  .pill.score{ color: var(--amber); }
  .pill .lbl{ color: var(--ink-faint); font-weight:600; margin-right:5px; font-size:10px; }

  /* ---------- Timer ---------- */
  .timer-wrap{ padding: 12px 20px 0; position:relative; }
  .timer-label{
    display:flex; justify-content:space-between;
    font-size: 10px; color: var(--ink-faint); font-weight:600;
    letter-spacing: 0.18em; margin-bottom: 6px;
  }
  .timer-track{
    height: 5px;
    background: var(--panel-2);
    border-radius: 999px;
    overflow:hidden;
    position:relative;
    border: 1px solid var(--line-soft);
  }
  .timer-fill{
    height:100%;
    width:100%;
    background: linear-gradient(90deg, var(--cyan), #7CF5D9);
    box-shadow: 0 0 10px rgba(52,228,224,0.6);
    transition: width 0.1s linear, background 0.3s ease;
    border-radius: 999px;
  }
  .timer-fill.low{ background: linear-gradient(90deg, var(--red), var(--amber)); box-shadow: 0 0 10px rgba(255,84,112,0.6); }

  /* ---------- Viewfinder ---------- */
  .viewfinder-wrap{
    position:relative;
    margin: 18px auto 4px;
    width: 288px;
    height: 288px;
  }
  .viewfinder{
    width:100%;
    height:100%;
    border-radius: 16px;
    background: #01040A;
    position:relative;
    overflow:hidden;
    border: 1px solid var(--line);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4), inset 0 0 40px rgba(0,0,0,0.6);
  }
  canvas#cropCanvas{
    width:100%;
    height:100%;
    display:block;
  }
  .crosshair{
    position:absolute; top:50%; left:50%;
    width:1px; height:1px; pointer-events:none;
  }
  .crosshair::before, .crosshair::after{
    content:""; position:absolute; background: rgba(52,228,224,0.55);
  }
  .crosshair::before{ width:14px; height:1px; top:0; left:-7px; }
  .crosshair::after{ width:1px; height:14px; top:-7px; left:0; }

  .bracket{
    position:absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--cyan);
    opacity: 0;
    transform: scale(1.15);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
    filter: drop-shadow(0 0 4px rgba(52,228,224,0.5));
  }
  .bracket.on{ opacity:0.95; transform: scale(1); }
  .bracket.tl{ top:9px; left:9px; border-right:none; border-bottom:none; }
  .bracket.tr{ top:9px; right:9px; border-left:none; border-bottom:none; }
  .bracket.bl{ bottom:9px; left:9px; border-right:none; border-top:none; }
  .bracket.br{ bottom:9px; right:9px; border-left:none; border-top:none; }

  .scan-line{
    position:absolute; left:0; right:0; height: 60px; top:-60px;
    background: linear-gradient(180deg, transparent, rgba(52,228,224,0.18), transparent);
    pointer-events:none;
  }
  .scan-line.run{ animation: sweep 0.7s ease-out; }
  @keyframes sweep{
    0%{ top:-60px; }
    100%{ top: 288px; }
  }

  .readout{
    position:absolute; left:10px; bottom:9px;
    font-size: 10px; font-weight:600; letter-spacing: 0.14em;
    color: var(--cyan); text-transform:uppercase;
    text-shadow: 0 0 6px rgba(52,228,224,0.5);
    pointer-events:none;
  }

  .feedback-banner{
    position:absolute;
    left:0; right:0; bottom:0;
    padding: 12px 14px;
    font-size: 13px;
    font-weight:700;
    text-align:center;
    color:#04140F;
    background: transparent;
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1);
  }
  .feedback-banner.show{ transform: translateY(0); }
  .feedback-banner.correct{ background: var(--mint); color:#04241A; }
  .feedback-banner.wrong{ background: var(--red); color:#2A0410; }

  /* ---------- Zoom control ---------- */
  .zoom-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    margin: 16px 0 2px;
  }
  .zoom-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--cyan);
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 999px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .zoom-btn:hover:not(:disabled){ border-color: var(--cyan); background: var(--cyan-dim); }
  .zoom-btn:disabled{ opacity:0.35; cursor:default; }
  .segs{ display:flex; gap:3px; }
  .seg{ width:12px; height:5px; border-radius:2px; background: var(--line); transition: background 0.15s ease; }
  .seg.used{ background: var(--cyan); box-shadow: 0 0 5px rgba(52,228,224,0.6); }

  /* ---------- Search ---------- */
  .search-area{ padding: 10px 20px 20px; position:relative; }
  .search-input{
    width:100%;
    padding: 12px 14px 12px 30px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    font-family:'JetBrains Mono', monospace;
    font-size: 13.5px;
    color: var(--ink);
    outline:none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-input::placeholder{ color: var(--ink-faint); font-family:'Noto Sans KR', sans-serif; }
  .search-input:focus{ border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(52,228,224,0.12); }
  .search-area::before{
    content:"›"; position:absolute; left:34px; top:22px;
    color: var(--cyan); font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px;
    pointer-events:none;
  }
  .results{
    margin-top: 10px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-height: 220px;
    overflow-y:auto;
  }
  .result-card{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 6px 9px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .result-card:hover{ transform: translateY(-2px); border-color: var(--cyan); background: var(--cyan-dim); }
  .result-card img{
    width: 52px;
    height: 52px;
    object-fit: contain;
    background: var(--bg-1);
    border-radius: 8px;
  }
  .result-card span{
    font-size: 11.5px;
    font-weight:500;
    color: var(--ink);
    text-align:center;
    line-height:1.2;
  }

  /* ---------- End screen ---------- */
  .end-screen{ padding: 30px 24px 26px; text-align:center; position:relative; }
  .end-eyebrow{ font-size:10px; font-weight:700; letter-spacing:0.32em; color: var(--cyan); margin-bottom:6px; }
  .end-title{
    font-family:'Rajdhani', sans-serif;
    font-size: 26px;
    font-weight:700;
    letter-spacing: 0.05em;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .end-total{
    font-family:'JetBrains Mono', monospace;
    font-size: 46px;
    font-weight:800;
    color: var(--amber);
    margin: 12px 0 20px;
    text-shadow: 0 0 22px rgba(255,178,56,0.35);
  }
  .round-list{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom: 22px;
  }
  .round-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 12.5px;
  }
  .round-item .rname{ font-weight:700; display:flex; align-items:center; gap:9px; color: var(--ink); }
  .tag{
    font-family:'Rajdhani', sans-serif;
    font-size:10px; font-weight:700; letter-spacing:0.08em;
    padding: 3px 7px; border-radius: 5px;
  }
  .tag.o{ background: var(--mint-dim); color: var(--mint); }
  .tag.x{ background: var(--red-dim); color: var(--red); }
  .round-item .rscore{ font-family:'JetBrains Mono', monospace; color: var(--ink-dim); font-weight:700; }
  .replay-btn{
    background: linear-gradient(135deg, var(--cyan), #1BA8A5);
    color: #01201E;
    border:none;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px 0;
    width:100%;
    border-radius: 12px;
    cursor:pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .replay-btn:hover{ filter: brightness(1.08); }
  .replay-btn:active{ transform: scale(0.98); }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="stage">
  <div class="card" id="gameCard">

    <!-- ===== Game screen ===== -->
    <div id="gameScreen">
      <div class="topbar">
        <div class="brand">
          <div class="eyebrow hud">만든놈 : 광인</div>
          <div class="title">니케 일부 보고 맞추기</div>
        </div>
        <div class="stat-pills">
          <div class="pill" id="roundPill"><span class="lbl hud">라운드</span>1/7</div>
          <div class="pill score" id="scorePill"><span class="lbl hud">점수</span>0</div>
        </div>
      </div>

      <div class="timer-wrap">
        <div class="timer-label hud"><span>남은시간</span><span id="timerNum">15.0s</span></div>
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      </div>

      <div class="viewfinder-wrap">
        <div class="viewfinder">
          <canvas id="cropCanvas" width="360" height="360"></canvas>
          <div class="scan-line" id="scanLine"></div>
          <div class="crosshair"></div>
          <div class="bracket tl" id="bTl"></div>
          <div class="bracket tr" id="bTr"></div>
          <div class="bracket bl" id="bBl"></div>
          <div class="bracket br" id="bBr"></div>
          <div class="readout hud" id="readout">Scanning</div>
          <div class="feedback-banner" id="feedbackBanner"></div>
        </div>
      </div>

      <div class="zoom-row">
        <button class="zoom-btn" id="zoomBtn">
          <span>범위 확장</span>
          <span class="segs" id="zoomDots"></span>
        </button>
      </div>

      <div class="search-area">
        <input type="text" class="search-input" id="searchInput" placeholder="캐릭터 이름 입력" autocomplete="off">
        <div class="results" id="resultsBox"></div>
      </div>
    </div>

    <!-- ===== End screen ===== -->
    <div id="endScreen" class="end-screen hidden">
      <div class="end-eyebrow hud">Mission Report</div>
      <div class="end-title">결과 분석 완료</div>
      <div class="end-total mono" id="endTotal">0</div>
      <div class="round-list" id="roundList"></div>
      <button class="replay-btn" id="replayBtn">재출격</button>
    </div>

  </div>
</div>

/* ======================================================
   설정값
   ====================================================== */
const ROUND_TIME   = 99000;   // 라운드당 제한시간(ms)
const MAX_ZOOM_USE = 3;       // 라운드당 "범위 확장" 사용 가능 횟수 (3회째에 전체 그림 공개)
const VP           = 360;     // 표시 캔버스 크기(px)
const ZOOM_FRACTIONS = [0.10, 0.16, 0.32, 1.0]; // level 0~3, level3=전체
const ALPHA_THRESH  = 20;     // 이 값보다 큰 alpha를 "불투명"으로 취급
const MIN_OPAQUE_RATIO = 0.5; // 최초 화면에서 요구되는 최소 불투명 비율

const imgUrl    = id => `https://static.dotgg.gg/nikke/characters/${id}_00.webp`;
const spriteUrl = id => `https://nikke-db-legacy.pages.dev/images/sprite/si_${id}_00_s.png`;

/* ======================================================
   상태
   ====================================================== */
let ROUND_COUNT = Math.min(7, charData.length);
let sequence = [];
let reserveQueue = [];
let roundIndex = 0;
let totalScore = 0;
let roundResults = [];

let currentChar = null;
let currentImg = null;
let currentMeta = null;   // {bbox, data, w, h} - 픽셀 분석 결과
let currentBBox = null;
let currentCenter = null;
let zoomLevel = 0;
let roundActive = false;
let roundStartTime = 0;
let timerHandle = null;

/* ======================================================
   DOM 참조
   ====================================================== */
const gameScreen    = document.getElementById('gameScreen');
const endScreen      = document.getElementById('endScreen');
const roundPill      = document.getElementById('roundPill');
const scorePill      = document.getElementById('scorePill');
const timerFill      = document.getElementById('timerFill');
const timerNum       = document.getElementById('timerNum');
const cropCanvas     = document.getElementById('cropCanvas');
const cropCtx        = cropCanvas.getContext('2d');
const feedbackBanner = document.getElementById('feedbackBanner');
const zoomBtn        = document.getElementById('zoomBtn');
const zoomDots       = document.getElementById('zoomDots');
const searchInput    = document.getElementById('searchInput');
const resultsBox     = document.getElementById('resultsBox');
const endTotal       = document.getElementById('endTotal');
const roundList      = document.getElementById('roundList');
const replayBtn      = document.getElementById('replayBtn');
const scanLine       = document.getElementById('scanLine');
const readout        = document.getElementById('readout');
const brackets       = [document.getElementById('bTl'), document.getElementById('bTr'), document.getElementById('bBl'), document.getElementById('bBr')];

const analysisCanvas = document.createElement('canvas');
const analysisCtx    = analysisCanvas.getContext('2d', { willReadFrequently:true });

/* ======================================================
   유틸
   ====================================================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// 이미지를 분석해 비-투명 영역(바운딩 박스)과, 가능하다면 픽셀 alpha 데이터를 반환.
// corsOk가 true인데도 픽셀 읽기가 막히면(예외적 상황) data=null로 안전하게 폴백.
function analyzeImage(img, corsOk){
  const w = img.naturalWidth, h = img.naturalHeight;
  analysisCanvas.width = w;
  analysisCanvas.height = h;
  analysisCtx.clearRect(0,0,w,h);
  analysisCtx.drawImage(img,0,0);

  let data = null;
  if(corsOk){
    try{ data = analysisCtx.getImageData(0,0,w,h).data; }
    catch(e){ data = null; }
  }

  if(data){
    let minX=w, minY=h, maxX=0, maxY=0, found=false;
    const step = 3;
    for(let y=0;y<h;y+=step){
      for(let x=0;x<w;x+=step){
        if(data[(y*w+x)*4+3] > ALPHA_THRESH){
          found = true;
          if(x<minX)minX=x; if(x>maxX)maxX=x;
          if(y<minY)minY=y; if(y>maxY)maxY=y;
        }
      }
    }
    if(found && (maxX-minX)>10 && (maxY-minY)>10){
      return { bbox:{x:minX, y:minY, w:(maxX-minX), h:(maxY-minY)}, data, w, h };
    }
  }
  // 픽셀 분석 불가 시 안전한 기본값
  return { bbox:{x:w*0.08, y:h*0.02, w:w*0.84, h:h*0.96}, data:null, w, h };
}

// rect 영역 내 불투명 픽셀 비율 추정 (data가 없으면 검증 불가 -> 1로 간주)
function opaqueRatio(meta, rect, grid=10){
  if(!meta.data) return 1;
  let count=0, total=0;
  for(let i=0;i<grid;i++){
    for(let j=0;j<grid;j++){
      const px = Math.floor(rect.sx + (i+0.5)/grid*rect.sw);
      const py = Math.floor(rect.sy + (j+0.5)/grid*rect.sh);
      if(px<0||py<0||px>=meta.w||py>=meta.h) continue;
      total++;
      if(meta.data[(py*meta.w+px)*4+3] > ALPHA_THRESH) count++;
    }
  }
  return total ? count/total : 0;
}

// 최초(level 0) 화면이 절반 이상 불투명하도록 무작위 후보 중에서 선택
function pickCenter(meta){
  const bbox = meta.bbox;
  let best = null, bestRatio = -1;
  for(let a=0; a<50; a++){
    const cx = bbox.x + bbox.w*(0.14 + Math.random()*0.72);
    const cy = bbox.y + bbox.h*(0.10 + Math.random()*0.80);
    const rect = getCropRect(bbox, 0, {x:cx, y:cy});
    const ratio = opaqueRatio(meta, rect);
    if(ratio >= MIN_OPAQUE_RATIO) return {x:cx, y:cy};
    if(ratio > bestRatio){ bestRatio = ratio; best = {x:cx, y:cy}; }
  }
  return best || {x: bbox.x + bbox.w/2, y: bbox.y + bbox.h/2};
}

function getCropRect(bbox, level, center){
  if(level >= 3){
    return {sx:bbox.x, sy:bbox.y, sw:bbox.w, sh:bbox.h};
  }
  const minDim = Math.min(bbox.w, bbox.h);
  const size = minDim * ZOOM_FRACTIONS[level];
  let sx = center.x - size/2;
  let sy = center.y - size/2;
  sx = Math.max(bbox.x, Math.min(sx, bbox.x + bbox.w - size));
  sy = Math.max(bbox.y, Math.min(sy, bbox.y + bbox.h - size));
  return {sx, sy, sw:size, sh:size};
}

function renderCrop(){
  const rect = getCropRect(currentBBox, zoomLevel, currentCenter);
  cropCtx.clearRect(0,0,VP,VP);
  cropCtx.drawImage(currentImg, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, VP, VP);
}

function renderZoomDots(){
  zoomDots.innerHTML = '';
  for(let i=0;i<MAX_ZOOM_USE;i++){
    const d = document.createElement('span');
    d.className = 'seg' + (i < zoomLevel ? ' used' : '');
    zoomDots.appendChild(d);
  }
  zoomBtn.disabled = zoomLevel >= MAX_ZOOM_USE || !roundActive;
}

function calcScore(elapsedMs, zoomUses){
  const timeRatio = Math.max(0, Math.min(1, 1 - elapsedMs/ROUND_TIME));
  const base = 400 + timeRatio*600;
  const penalty = zoomUses*120;
  return Math.max(50, Math.round(base - penalty));
}

/* ======================================================
   라운드 진행
   ====================================================== */
function startGame(){
  totalScore = 0;
  roundResults = [];
  roundIndex = 0;
  ROUND_COUNT = Math.min(7, charData.length);
  const allShuffled = shuffle(charData);
  sequence = allShuffled.slice(0, ROUND_COUNT);
  reserveQueue = allShuffled.slice(ROUND_COUNT); // 이미지 로드 실패 시 대체용 예비 풀
  endScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  scorePill.innerHTML = '<span class="lbl hud">점수</span>0';
  startRound();
}

function startRound(){
  clearInterval(timerHandle);
  currentChar = sequence[roundIndex];
  roundActive = false;
  zoomLevel = 0;
  feedbackBanner.className = 'feedback-banner';
  feedbackBanner.textContent = '';
  searchInput.value = '';
  resultsBox.innerHTML = '';
  roundPill.innerHTML = `<span class="lbl hud">라운드</span>${roundIndex+1}/${ROUND_COUNT}`;
  brackets.forEach(b => b.classList.remove('on'));
  readout.textContent = 'Scanning';
  renderZoomDots();

  cropCtx.clearRect(0,0,VP,VP);
  attemptLoad(true);
}

// useCors=true: crossOrigin="anonymous"로 시도 (성공 시 픽셀 분석 가능)
// 실패하면 useCors=false로 재시도 (표시는 정상 동작, 분석은 폴백)
function attemptLoad(useCors){
  const img = new Image();
  if(useCors) img.crossOrigin = 'anonymous';
  img.onload = () => {
    const meta = analyzeImage(img, useCors);
    currentImg = img;
    currentMeta = meta;
    currentBBox = meta.bbox;
    currentCenter = pickCenter(meta);
    renderCrop();
    roundActive = true;
    renderZoomDots();
    roundStartTime = Date.now();
    scanLine.classList.remove('run'); void scanLine.offsetWidth; scanLine.classList.add('run');
    brackets.forEach(b => b.classList.add('on'));
    readout.textContent = '. Target Locked';
    runTimer();
    searchInput.focus();
  };
  img.onerror = () => {
    if(useCors){ attemptLoad(false); return; }
    handleImageFailure();
  };
  img.src = imgUrl(currentChar.id);
}

// 이미지가 끝내 로드되지 않을 때: 플레이해보지도 못한 캐릭터를 "오답"으로 처리하지 않고
// 예비 캐릭터로 조용히 교체하거나(우선), 예비가 없으면 해당 라운드를 점수 집계 없이 건너뜀.
function handleImageFailure(){
  if(reserveQueue.length > 0){
    const idx = Math.floor(Math.random() * reserveQueue.length);
currentChar = reserveQueue.splice(idx, 1)[0];
    sequence[roundIndex] = currentChar;
    attemptLoad(true);
  }else{
    sequence.splice(roundIndex, 1);
    ROUND_COUNT = sequence.length;
    if(sequence.length === 0){ showEndScreen(); return; }
    if(roundIndex >= sequence.length) roundIndex = sequence.length - 1;
    startRound();
  }
}

function runTimer(){
  timerFill.style.width = '100%';
  timerFill.classList.remove('low');
  timerHandle = setInterval(() => {
    const elapsed = Date.now() - roundStartTime;
    const remain = Math.max(0, ROUND_TIME - elapsed);
    const pct = Math.max(0, 100 - (elapsed/ROUND_TIME)*100);
    timerFill.style.width = pct + '%';
    timerNum.textContent = (remain/1000).toFixed(1) + 's';
    if(pct < 25) timerFill.classList.add('low');
    if(elapsed >= ROUND_TIME){
      clearInterval(timerHandle);
      timeUp();
    }
  }, 80);
}

function timeUp(){
  if(!roundActive) return;
  roundActive = false;
  zoomLevel = 3;
  renderCrop();
  renderZoomDots();
  readout.textContent = 'Time Out';
  showFeedback(false, 0);
  roundResults.push({char: currentChar, correct:false, elapsed:ROUND_TIME, score:0});
  scheduleNext();
}

function submitAnswer(pickedId){
  if(!roundActive) return;
  clearInterval(timerHandle);
  roundActive = false;
  const elapsed = Date.now() - roundStartTime;
  const correct = pickedId === currentChar.id;
  const score = correct ? calcScore(elapsed, zoomLevel) : 0;
  totalScore += score;
  scorePill.innerHTML = `<span class="lbl hud">점수</span>${totalScore}`;

  zoomLevel = 3;
  renderCrop();
  renderZoomDots();
  readout.textContent = correct ? 'Confirmed' : 'Mismatch';
  showFeedback(correct, score);
  roundResults.push({char: currentChar, correct, elapsed, score});
  scheduleNext();
}

function showFeedback(correct, score){
  feedbackBanner.className = 'feedback-banner show ' + (correct ? 'correct' : 'wrong');
  if(correct){
    feedbackBanner.textContent = `LOCK ON · ${currentChar.name} · +${score}`;
  }else{
    feedbackBanner.textContent = `MISS · 정답은 "${currentChar.name}"`;
  }
  resultsBox.innerHTML = '';
  searchInput.blur();
}

function scheduleNext(){
  setTimeout(() => {
    advanceRound();
  }, 1600);
}

function advanceRound(){
  roundIndex++;
  if(roundIndex >= ROUND_COUNT){
    showEndScreen();
  }else{
    startRound();
  }
}

/* ======================================================
   검색
   ====================================================== */
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if(!q){ resultsBox.innerHTML=''; return; }
  const matches = charData.filter(c => c.name.includes(q)).slice(0, 9);
  resultsBox.innerHTML = '';
  matches.forEach(c => {
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<img src="${spriteUrl(c.id)}" onerror="this.style.opacity=0.15"><span>${c.name}</span>`;
    card.addEventListener('click', () => submitAnswer(c.id));
    resultsBox.appendChild(card);
  });
});

/* ======================================================
   확대(범위 확장) 버튼
   ====================================================== */
zoomBtn.addEventListener('click', () => {
  if(!roundActive || zoomLevel >= MAX_ZOOM_USE) return;
  zoomLevel++;
  renderCrop();
  renderZoomDots();
  readout.textContent = zoomLevel >= 3 ? 'Full View' : 'Range Expanded';
});

/* ======================================================
   종료 화면
   ====================================================== */
function showEndScreen(){
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  roundList.innerHTML = '';
  roundResults.forEach(r => {
    const item = document.createElement('div');
    item.className = 'round-item';
    item.innerHTML = `
      <div class="rname">
        <span class="tag ${r.correct ? 'o':'x'}">${r.correct ? 'HIT':'MISS'}</span>
        ${r.char.name}
      </div>
      <div class="rscore mono">${r.score}</div>
    `;
    roundList.appendChild(item);
  });

  // 점수 카운트업 연출
  const target = totalScore;
  const start = performance.now();
  const dur = 700;
  function tick(now){
    const p = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    endTotal.textContent = Math.round(target*eased);
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

replayBtn.addEventListener('click', startGame);

/* ======================================================
   시작
   ====================================================== */
startGame();
</script>
</body>
</html>
